<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon KIARA — ikon bayi, sama dengan yang dipakai di splash screen
  (Lucide "baby"). Digambar sebagai kotak berisi warna, bukan garis di atas
  latar transparan: di ukuran 16px garis tipis nyaris tidak terlihat, dan
  tab browser bisa berlatar terang maupun gelap.

  Warna #b03a5b = aksen plum-wine yang dipakai di seluruh aplikasi.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#b03a5b"/>
  <g transform="translate(4.5 4.5) scale(0.958)"
     fill="none" stroke="#fff5f0" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/>
    <path d="M15 12h.01"/>
    <path d="M19.38 6.813A9 9 0 0 1 20.8 10.2a2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>
    <path d="M9 12h.01"/>
  </g>
</svg>
